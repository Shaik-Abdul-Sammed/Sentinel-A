services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=sentinel
      - POSTGRES_PASSWORD=sentinel
      - POSTGRES_DB=sentinel_a
    ports:
      - "5432:5432"
    volumes:
      - sentinel_pg_data:/var/lib/postgresql/data
    networks:
      - sentinel-mesh

  backend:
    build:
      context: .
      dockerfile: infrastructure/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=sentinel_a_secret_2026
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - DATABASE_URL=postgresql+psycopg2://sentinel:sentinel@postgres:5432/sentinel_a
    depends_on:
      - postgres
    command: ["/bin/sh", "-c", "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"]
    networks:
      - sentinel-mesh

  frontend:
    build:
      context: .
      dockerfile: infrastructure/frontend.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - sentinel-mesh

networks:
  sentinel-mesh:
    driver: bridge

volumes:
  sentinel_pg_data:
