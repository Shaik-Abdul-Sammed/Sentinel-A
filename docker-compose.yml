services:
  backend:
    build:
      context: .
      dockerfile: infrastructure/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=sentinel_a_secret_2026
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    networks:
      - sentinel-mesh

  frontend:
    build:
      context: .
      dockerfile: infrastructure/frontend.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - sentinel-mesh

networks:
  sentinel-mesh:
    driver: bridge
